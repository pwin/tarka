[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pwin/tarka"
authors = ["Peter Winstanley"]

[workspace.dependencies]
# The Oxigraph crates, as used by oxi-gen, HOLOS and SHACL_Engine. RDF 1.2 features
# stay off: tarka works with RDF 1.1 and SPARQL 1.1 (matches over these types keep
# wildcard arms, so a build that unifies `rdf-12`/`sparql-12` on still compiles).
oxrdf = "0.3"
oxrdfio = "0.2"
oxsdatatypes = "0.2.3"
spargebra = "0.4.7"
spareval = "0.2.7"
csv = "1.4"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
rayon = "1"
# HTTP for the Graph Store Protocol; rustls, so there is no system TLS library to find
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
polars = { version = "0.55", default-features = false, features = ["fmt", "parquet", "ipc", "lazy", "dtype-full", "timezones"] }
# SHACL_Engine (github.com/pwin/SHACL_Engine); the crates.io crate called shacl is another project.
# Without its default features: no `rdf-12`, so the whole build stays RDF 1.1.
shacl = { git = "https://github.com/pwin/SHACL_Engine", rev = "7982c9e45c06d9308d041a78cd105e22b11eba70", default-features = false }

tarka-core = { path = "crates/tarka-core", version = "0.1.0" }
tarka-io = { path = "crates/tarka-io", version = "0.1.0" }
tarka-tarql = { path = "crates/tarka-tarql", version = "0.1.0" }
tarka-ottr = { path = "crates/tarka-ottr", version = "0.1.0" }
tarka = { path = "crates/tarka", version = "0.1.0" }
tarka-polars = { path = "crates/tarka-polars", version = "0.1.0" }
tarka-shacl = { path = "crates/tarka-shacl", version = "0.1.0" }
tarka-bottr = { path = "crates/tarka-bottr", version = "0.1.0" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# Unwinding, not abort: a panic must never take the whole run down without an error
# message, and the Python bindings need unwinding to turn panics into exceptions.
