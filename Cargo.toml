[workspace]
resolver = "3"
members = ["crates/*"]
# Everything but the Python module, which maturin builds. Built in the same cargo run, it turns
# on pyo3 in polars-error (through pyo3-polars), which links python3.dll into the `tarka`
# command, and the command then cannot start without Python. So a plain `cargo build` or
# `cargo test` leaves it out; `--workspace` brings it back.
default-members = [
    "crates/tarka",
    "crates/tarka-bottr",
    "crates/tarka-cli",
    "crates/tarka-core",
    "crates/tarka-io",
    "crates/tarka-ottr",
    "crates/tarka-polars",
    "crates/tarka-shacl",
    "crates/tarka-tarql",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pwin/tarka"
authors = ["Peter Winstanley"]

[workspace.dependencies]
# HOLOS (github.com/pwin/triplestore): the SPARQL evaluator and the RDF types, parsers and
# serialisers, through holos-engine, which re-exports the Oxigraph crates it is built on
# (oxrdf, oxrdfio, spargebra, spareval, sparesults, oxsdatatypes, oxiri) with HOLOS's RDF 1.2
# and SPARQL 1.2 features on. tarka still accepts RDF 1.1 and SPARQL 1.1 only: its own checks
# refuse the rest. Local for now: a git revision once holos-engine re-exports them upstream.
holos-engine = { path = "C:/Users/Pedro/AppData/Local/Temp/claude/e8e1beb43c5c05df/5e4fbdbc-2bbc-4d12-81fb-d018e2d3f6f2/scratchpad/triplestore/crates/holos-engine" }
csv = "1.4"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
rayon = "1"
# HTTP for the Graph Store Protocol; rustls, so there is no system TLS library to find
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
polars = { version = "0.55", default-features = false, features = ["fmt", "parquet", "ipc", "lazy", "dtype-full", "timezones"] }
# SHACL_Engine 0.3.4 (github.com/pwin/SHACL_Engine); the crates.io crate called shacl is another project.
# Its `rdf-12` feature on, as HOLOS turns on the Oxigraph crates' own; `parallel` off.
shacl = { git = "https://github.com/pwin/SHACL_Engine", rev = "986c31ba4e071560d51fed36e99abd8cb3747a87", default-features = false, features = ["rdf-12"] }

tarka-core = { path = "crates/tarka-core", version = "0.2.2" }
tarka-io = { path = "crates/tarka-io", version = "0.2.2" }
tarka-tarql = { path = "crates/tarka-tarql", version = "0.2.2" }
tarka-ottr = { path = "crates/tarka-ottr", version = "0.2.2" }
tarka = { path = "crates/tarka", version = "0.2.2" }
tarka-polars = { path = "crates/tarka-polars", version = "0.2.2" }
tarka-shacl = { path = "crates/tarka-shacl", version = "0.2.2" }
tarka-bottr = { path = "crates/tarka-bottr", version = "0.2.2" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# Unwinding, not abort: a panic must never take the whole run down without an error
# message, and the Python bindings need unwinding to turn panics into exceptions.

# HOLOS's two fixes to the Oxigraph crates, so that tarka evaluates SPARQL as HOLOS does: a
# decimal product too long to hold exactly is rounded rather than refused (oxsdatatypes), and
# a duration may come first in `+` with a date, time or dateTime (spareval). A [patch] applies
# only from the workspace that builds, so HOLOS's own does not reach tarka: these repeat it.
[patch.crates-io]
oxsdatatypes = { path = "C:/Users/Pedro/AppData/Local/Temp/claude/e8e1beb43c5c05df/5e4fbdbc-2bbc-4d12-81fb-d018e2d3f6f2/scratchpad/triplestore/vendor/oxsdatatypes" }
spareval = { path = "C:/Users/Pedro/AppData/Local/Temp/claude/e8e1beb43c5c05df/5e4fbdbc-2bbc-4d12-81fb-d018e2d3f6f2/scratchpad/triplestore/vendor/spareval" }
