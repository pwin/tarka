[package]
name = "tarka-tarql"
description = "TARQL (SPARQL CONSTRUCT over CSV rows) for tarka: query to plan, and evaluation with spareval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# For tests: the Oxigraph crates' RDF 1.2 parsing, as a build with RDF 1.2 crates in
# it turns on, to check that tarka still refuses RDF 1.2 there. Not RDF 1.2 support.
rdf-12-parsing = ["oxrdf/rdf-12", "spargebra/sparql-12", "spareval/sparql-12"]

[dependencies]
oxiri = "0.2"
oxrdf.workspace = true
spargebra.workspace = true
spareval.workspace = true
thiserror.workspace = true
tarka-core.workspace = true
